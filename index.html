<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gold Coin 💰</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #fff200, #ffd700);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #444;
    }
    #coin-count {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #333;
    }
    button {
      padding: 20px 40px;
      font-size: 22px;
      background-color: #ffcc00;
      border: none;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <h1>💰 Gold Coin Tap</h1>
  <div id="coin-count">Coins: 0</div>
  <button id="tap-btn">Tap to Earn</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let count = parseInt(localStorage.getItem("coinCount")) || 0;

    const countDiv = document.getElementById("coin-count");
    const tapBtn = document.getElementById("tap-btn");

    function updateDisplay() {
      countDiv.textContent = "Coins: " + count;
      localStorage.setItem("coinCount", count);
    }

    tapBtn.addEventListener("click", () => {
      count += 1;
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
